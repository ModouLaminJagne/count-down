<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <h1>Countdown Timer</h1>
      <p class="subtitle">Stay focused and on track</p>

      <div class="timer-container">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #667eea; stop-opacity: 1" />
              <stop offset="100%" style="stop-color: #764ba2; stop-opacity: 1" />
            </linearGradient>
          </defs>
          <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
          <circle
            class="timer-circle-progress"
            cx="50"
            cy="50"
            r="45"
            id="progress-ring">
          </circle>
        </svg>
        <div class="timer-text">
          <div id="timer-label" aria-live="polite" aria-atomic="true">
            Remaining time
          </div>
          <div id="time">03:00</div>
          <div class="time-label">seconds</div>
        </div>
      </div>

      <div class="controls">
        <div>
          <label for="seconds">Duration (seconds)</label>
          <input
            id="seconds"
            type="number"
            min="1"
            step="1"
            value="180"
            aria-describedby="seconds-help"
          />
          <small id="seconds-help">Enter a number of seconds (min 1)</small>
        </div>
        <div class="buttons">
          <button id="start" type="button">▶ Start</button>
          <button id="reset" type="button">↻ Reset</button>
        </div>
      </div>

      <div id="completion-message" class="completion-message" hidden aria-live="polite">
        <div class="message-inner">
          <div class="message-title">Congratulations</div>
          <div class="message-body">
            SOSHSA is live — <a href="https://www.soshsa.com" target="_blank" rel="noopener">www.soshsa.com</a>
          </div>
        </div>
      </div>
    </main>

    <canvas id="confetti-canvas" hidden aria-hidden="true"></canvas>
    <script src="app.js"></script>
  </body>
</html>
